<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Удостоверение личности</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка -->
  <header class="doc-header">
    <button class="close-btn" onclick="history.back()">&times;</button>
    <h1 class="header-title">Удостоверение личности</h1>
    
    <!-- Иконка Поделиться (только во вкладке Документ) -->
    <button class="top-share-btn" id="top-share-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
    </button>
  </header>

  <!-- Переключатель вкладок -->
  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('doc')">Документ</button>
    <button class="tab-btn" onclick="switchTab('details')">Реквизиты</button>
  </div>

  <!-- Вкладка 1: Документ -->
  <div id="tab-doc" class="tab-content active">
    <div class="doc-images-wrapper">
      <img src="my-id.jpg" class="id-card-full">
    </div>

    <div class="bottom-actions">
      <button class="btn-primary">
        <span class="qr-icon"></span>
        Открыть доступ
      </button>
      <button class="btn-more">•••</button>
    </div>
  </div>

  <!-- Вкладка 2: Реквизиты -->
  <div id="tab-details" class="tab-content">
    <div class="details-list">
      <div class="detail-item">
        <div class="detail-label">Номер документа</div>
        <div class="detail-value">059261764</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">ИИН</div>
        <div class="detail-value">031103551653</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">ФИО</div>
        <div class="detail-value">ЗӘРУБАЕВ СЕРІКБОЛСЫН АСХАТҰЛЫ</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Дата рождения</div>
        <div class="detail-value">03.11.2005</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Дата выдачи</div>
        <div class="detail-value">30.10.2024</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Срок выдачи</div>
        <div class="detail-value">29.10.2034</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Орган выдачи</div>
        <div class="detail-value">ҚР ІШКІ ІСТЕР МИНИСТРЛІГІ</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Национальность</div>
        <div class="detail-value">ҚАЗАҚ</div>
      </div>
    </div>

    <div class="bottom-actions">
      <button class="btn-send-details" id="share-details-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" style="margin-right: 8px;">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        Отправить реквизиты
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
