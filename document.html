<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <!-- Верхняя панель с кнопкой "Назад" -->
<div class="header-nav">
  <a href="index.html" class="back-btn" aria-label="Назад">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <h1 class="title">Удостоверение личности</h1>
</div>
</head>

<body>
  <div class="container">


    <div class="tabs">
      <div class="tab active" id="tabDoc">Документ</div>
      <div class="tab" id="tabReq">Реквизиты</div>
    </div>

    <!-- Секция документа -->
    <div id="documentSection">
      <div class="zoom-wrapper">
        <img src="my-id.jpg" class="document-image" id="zoomImage" alt="Удостоверение">
      </div>
      <div class="primary-btn" id="openAccessBtn">Открыть доступ</div>
    </div>

    <!-- Секция реквизитов -->
    <div id="requisitesSection" class="hidden">
      <div class="info-item">
        <div class="label">ФИО</div>
        <div class="value">Зәрубаев Серікболсын Асхатұлы</div>
      </div>

      <div class="info-item">
        <div class="label">ИИН</div>
        <div class="value">031103551653</div>
      </div>

      <div class="info-item">
        <div class="label">Дата рождения</div>
        <div class="value">31.11.2003</div>
      </div>

      <div class="info-item">
        <div class="label">Номер документа</div>
        <div class="value">059261764</div>
      </div>

      <div class="info-item">
        <div class="label">Дата выдачи</div>
        <div class="value">30.10.2024</div>
      </div>

      <div class="info-item">
        <div class="label">Срок выдачи</div>
        <div class="value">29.10.2034</div>
      </div>

      <div class="primary-btn" id="shareBtn">Отправить реквизиты</div>
    </div>

  </div>

  <!-- Модальное окно с QR-кодом -->
  <div id="qrModal" class="qr-modal hidden">
    <div class="qr-sheet">
      <div class="drag-line"></div>
      <h2>Доступ к документу</h2>
      <div id="qrcode"></div>
      <div id="timer" class="timer"></div>
      <div id="shortCode" class="short-code"></div>
    </div>
  </div>

  <script>
    document.addEventListener("touchmove", function(e) {
      if (!e.target.closest("#zoomImage")) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("gesturechange", e => e.preventDefault());
    document.addEventListener("gestureend", e => e.preventDefault());
  </script>

  <script src="app.js"></script>
</body>
</html>
