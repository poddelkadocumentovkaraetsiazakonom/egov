<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <title>Удостоверение личности</title>
</head>

<body>
  <div class="container">

    <!-- Шапка -->
    <div class="doc-header">
      <a href="index.html" class="icon-btn" aria-label="Назад">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
      <div class="doc-header-title">Удостоверение личности</div>
      <div style="width: 36px;"></div> <!-- Пустой блок для симметрии шапки -->
    </div>

    <!-- Вкладки -->
    <div class="tabs">
      <div class="tab" id="tabDoc">Документ</div>
      <div class="tab active" id="tabReq">Реквизиты</div>
    </div>

    <!-- Секция 1: Документ -->
    <div id="documentSection" class="hidden">
      <div class="zoom-wrapper">
        <img src="my-id.jpg" class="document-image" id="zoomImage" alt="Удостоверение">
      </div>

      <div class="doc-bottom-actions">
        <button class="primary-btn" id="openAccessBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
          </svg>
          <span>Открыть доступ</span>
        </button>
        <button class="more-btn">...</button>
      </div>
    </div>

    <!-- Секция 2: Реквизиты (согласно оригиналу) -->
    <div id="requisitesSection" class="req-container">
      
      <div class="req-list">
        <div class="info-item" data-copy="059261764">
          <div class="info-text">
            <div class="label">Номер документа</div>
            <div class="value">059261764</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="051103551653">
          <div class="info-text">
            <div class="label">ИИН</div>
            <div class="value">051103551653</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="ЗӘРУБАЕВ СЕРІКБОЛСЫН АСХАТҰЛЫ">
          <div class="info-text">
            <div class="label">ФИО</div>
            <div class="value">ЗӘРУБАЕВ СЕРІКБОЛСЫН<br>АСХАТҰЛЫ</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="03.11.2005">
          <div class="info-text">
            <div class="label">Дата рождения</div>
            <div class="value">03.11.2005</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="30.10.2024">
          <div class="info-text">
            <div class="label">Дата выдачи</div>
            <div class="value">30.10.2024</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="29.10.2034">
          <div class="info-text">
            <div class="label">Срок выдачи</div>
            <div class="value">29.10.2034</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="ҚР ІШКІ ІСТЕР МИНИСТРЛІГІ">
          <div class="info-text">
            <div class="label">Орган выдачи</div>
            <div class="value">ҚР ІШКІ ІСТЕР МИНИСТРЛІГІ</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <div class="info-item" data-copy="ҚАЗАҚ">
          <div class="info-text">
            <div class="label">Национальность</div>
            <div class="value">ҚАЗАҚ</div>
          </div>
          <button class="copy-btn" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Кнопка отправить реквизиты -->
      <button class="send-req-btn" id="sendReqBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b60e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        <span>Отправить реквизиты</span>
      </button>

    </div>

  </div>

  <!-- Уведомление о скопированном тексте -->
  <div id="toast" class="toast hidden">Скопировано</div>

  <!-- Модальное окно QR-кода -->
  <div id="qrModal" class="qr-modal hidden">
    <div class="qr-sheet">
      <div class="drag-line"></div>
      <h2>Доступ к документу</h2>
      <div id="qrcode"></div>
      <div id="timer" class="timer"></div>
      <div id="shortCode" class="short-code"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
