<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <title>Удостоверение личности</title>
</head>

<body class="doc-body">
  <div class="sheet-container">
    
    <!-- Нативная шапка eGov (Шторка) -->
    <div class="sheet-header">
      <a href="index.html" class="close-btn" aria-label="Закрыть">✕</a>
      <h1 class="sheet-title">Удостоверение личности</h1>
      <button class="share-icon-btn" id="headerShareBtn" aria-label="Поделиться">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </div>

    <!-- Переключатель Документ / Реквизиты -->
    <div class="tab-control-wrapper">
      <div class="tabs">
        <div class="tab active" id="tabDoc">Документ</div>
        <div class="tab" id="tabReq">Реквизиты</div>
      </div>
    </div>

    <!-- Основной контент с прокруткой -->
    <div class="sheet-content">
      
      <!-- Секция документа -->
      <div id="documentSection">
        <div class="zoom-wrapper">
          <img src="my-id.jpg" class="document-image" id="zoomImage" alt="Удостоверение">
        </div>
      </div>

      <!-- Секция реквизитов -->
      <div id="requisitesSection" class="hidden">
        <div class="info-item">
          <div class="label">ФИО</div>
          <div class="value">Зәрубаев Серікболсын Асхатұлы</div>
        </div>

        <div class="info-item">
          <div class="label">ИИН</div>
          <div class="value">031103551653</div>
        </div>

        <div class="info-item">
          <div class="label">Дата рождения</div>
          <div class="value">03.11.2003</div>
        </div>

        <div class="info-item">
          <div class="label">Номер документа</div>
          <div class="value">059261764</div>
        </div>

        <div class="info-item">
          <div class="label">Дата выдачи</div>
          <div class="value">30.10.2024</div>
        </div>

        <div class="info-item">
          <div class="label">Срок выдачи</div>
          <div class="value">29.10.2034</div>
        </div>

        <div class="info-item">
          <div class="label">Орган выдачи</div>
          <div class="value">ҚР ІШКІ ІСТЕР МИНИСТРЛІГІ</div>
        </div>

        <div class="info-item">
          <div class="label">Национальность</div>
          <div class="value">ҚАЗАҚ</div>
        </div>
      </div>

    </div>

    <!-- Нижняя панель eGov -->
    <div class="doc-bottom-bar">
      <button class="primary-btn" id="openAccessBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7z"/>
        </svg>
        <span>Открыть доступ</span>
      </button>
      <button class="more-btn" aria-label="Ещё">• • •</button>
    </div>

  </div>

  <!-- Модальное окно с QR-кодом -->
  <div id="qrModal" class="qr-modal hidden">
    <div class="qr-sheet">
      <div class="drag-line"></div>
      <h2>Доступ к документу</h2>
      <div id="qrcode"></div>
      <div id="timer" class="timer"></div>
      <div id="shortCode" class="short-code"></div>
    </div>
  </div>

  <script>
    document.addEventListener("touchmove", function(e) {
      if (!e.target.closest("#zoomImage")) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("gesturechange", e => e.preventDefault());
    document.addEventListener("gestureend", e => e.preventDefault());
  </script>

  <script src="app.js"></script>
</body>
</html>
